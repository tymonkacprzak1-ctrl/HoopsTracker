<!doctype html>
<html lang="pl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#090a0c"><meta name="description" content="HoopTracker — basketball performance tracker">
<link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<title>HoopTracker — Player Performance</title>
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <a class="brand" href="#"><span class="brand-mark">H</span><span>HOOP<span class="muted">TRACKER</span><small>PLAYER PERFORMANCE SYSTEM</small></span></a>
    <div class="side-label">WORKSPACE</div>
    <nav id="nav">
      <button class="nav-item active" data-page="dashboard"><i>◫</i> Overview</button>
      <button class="nav-item" data-page="shots"><i>◎</i> Shot tracker</button>
      <button class="nav-item" data-page="games"><i>▣</i> Match stats</button>
      <button class="nav-item" data-page="calendar"><i>▦</i> Training calendar</button>
      <button class="nav-item" data-page="progress"><i>↗</i> Progress</button>
      <button class="nav-item" data-page="recovery"><i>◌</i> Recovery & fuel</button>
    </nav>
    <div class="sidebar-bottom"><span class="status-dot"></span> LOCAL PROFILE <span class="version">V1.0</span></div>
  </aside>
  <main class="main">
    <header class="topbar"><div><div class="eyebrow">PLAYER WORKSPACE / 2026</div><h1 id="page-title">Overview</h1></div><div class="top-actions"><span class="live-pill"><span class="status-dot"></span> TRACKING ACTIVE</span><div class="avatar">P</div></div></header>
    <section id="content"></section>
    <footer>HOOPTRACKER <span>BUILT FOR THE WORK.</span></footer>
  </main>
</div>
<div id="toast" role="status"></div>
<script src="app.js"></script>
<script>if('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));</script>
</body></html>
